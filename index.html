<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dónde estoy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Dónde estoy</title>
<meta name="description" content="Tu ubicación y coordenadas al momento para dársela a emergencias.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una columna de lectura rápida — coordenadas enormes arriba, acciones grandes abajo */
:root {
  --bg: #F4F2F1;
  --surface: #FFFFFF;
  --ink: #17110F;
  --muted: #6A5F5B;
  --line: #E0D9D6;
  --sos: #B3261E;
  --ok: #1E8A52;
  --warn: #B07A10;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120E0D; --surface: #1C1716; --ink: #F3EEEC; --muted: #A99D98; --line: #332926;
    --sos: #F05A4F; --ok: #4CC384; --warn: #E2B04A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120E0D; --surface: #1C1716; --ink: #F3EEEC; --muted: #A99D98; --line: #332926;
  --sos: #F05A4F; --ok: #4CC384; --warn: #E2B04A; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
button, a.btn { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sos); outline-offset: 2px; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
h1 { font: 800 1.6rem/1 var(--font-body); margin: 0; }
.fix { font: 500 .8rem var(--font-data); display: flex; align-items: center; gap: 6px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.fix.live .dot { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.fix.weak .dot { background: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; min-width: 0; }
.coord-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
/* Formatos en una fila, a todo el ancho del recuadro */
.fmt { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fmt button { flex: 1; min-width: 0; background: none; border: none; padding: 8px 4px; font: 500 .8rem var(--font-body); color: var(--muted); cursor: pointer; text-align: center; }
.fmt button + button { border-left: 1px solid var(--line); }
.fmt button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.fmt-hint { font: 500 .78rem var(--font-body); color: var(--muted); }
.label { font: 500 .72rem var(--font-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.coords { font: 700 clamp(1.5rem, 7.2vw, 2.1rem)/1.2 var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.coords span { display: block; }
.alt { font: 500 1.05rem/1.5 var(--font-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.address { font-size: 1.05rem; font-weight: 500; overflow-wrap: anywhere; }
.coordbody { display: flex; gap: 12px; align-items: flex-start; }
.coordmain { flex: 1; min-width: 0; display: grid; gap: 6px; }
.stamp { white-space: nowrap; }
.meta { font: 500 .8rem var(--font-data); color: var(--muted); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  border-radius: 12px; padding: 14px 10px; font-weight: 800; text-decoration: none;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn.call { grid-column: 1 / -1; background: var(--sos); border-color: var(--sos); color: #FFFFFF; font-size: 1.55rem; padding: 20px; }
.btn.call svg { width: 26px; height: 26px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--bg); font-size: .9rem; font-weight: 500; padding: 10px 16px; border-radius: 10px;
  max-width: calc(100% - 32px); text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25);
}
.toast:empty { display: none; }

.notice { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 12px; padding: 14px; font-size: .92rem; }
.notice b { display: block; margin-bottom: 4px; }
.notice button { margin-top: 10px; background: var(--ink); color: var(--bg); border: none; border-radius: 8px; padding: 9px 14px; font-weight: 700; }
.radio { font-size: .88rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.radio b { color: var(--ink); }

/* Pestañas: Ubicación / Brújula */
.tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { flex: 1; border: none; background: none; border-radius: 9px; padding: 10px 6px; font: 800 .95rem var(--font-body); color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 7px; }
.tabs button svg { width: 18px; height: 18px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.pane { display: grid; gap: 12px; }

/* Brújula */
.cmp { display: grid; gap: 14px; justify-items: center; padding: 18px 16px 20px; }
.cmp-read { text-align: center; }
.cmp-deg { font: 700 clamp(3rem, 15vw, 4.2rem)/1 var(--font-data); font-variant-numeric: tabular-nums; }
.cmp-dir { font: 800 1.25rem var(--font-body); color: var(--sos); margin-top: 4px; letter-spacing: .04em; }
.dialbox { position: relative; width: min(82vw, 340px); aspect-ratio: 1; }
.dialbox svg { width: 100%; height: 100%; display: block; }
.lubber { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0;
  border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 18px solid var(--sos); z-index: 2; }
.d-ring { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.d-tick { stroke: var(--muted); stroke-width: 1.5; }
.d-tick.big { stroke: var(--ink); stroke-width: 3; }
.d-num { font: 500 13px var(--font-data); fill: var(--muted); text-anchor: middle; dominant-baseline: middle; }
.d-card { font: 800 30px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.d-card.n { fill: var(--sos); }
.d-inter { font: 800 16px var(--font-body); fill: var(--muted); text-anchor: middle; dominant-baseline: middle; }
.d-center { fill: var(--ink); }
.cmp-btn { background: var(--sos); color: #FFFFFF; border: none; border-radius: 12px; padding: 14px 22px; font: 800 1.05rem var(--font-body); }
.cmp-note { font-size: .82rem; color: var(--muted); text-align: center; max-width: 34ch; }
.cmp-meta { font: 500 .8rem var(--font-data); color: var(--muted); text-align: center; }
footer { font-size: .76rem; color: var(--muted); }
footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dónde estoy</h1>
    <div class="fix" id="fix"><span class="dot"></span><span id="fixTxt">Buscando GPS…</span></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Secciones">
    <button type="button" role="tab" id="tLoc" aria-selected="true" aria-controls="pLoc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Ubicación
    </button>
    <button type="button" role="tab" id="tCmp" aria-selected="false" aria-controls="pCmp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>
      Brújula
    </button>
  </div>

  <div class="pane" id="pLoc" role="tabpanel" aria-labelledby="tLoc">
  <div class="notice" id="notice" hidden></div>

  <section class="card" aria-live="polite">
    <div class="coord-head">
      <div class="label">Coordenadas</div>
      <div class="meta stamp"><span id="fixDate"></span> · <span id="fixTime"></span></div>
    </div>
    <div class="coordbody">
      <div class="coordmain" id="coordmain">
        <div class="coords" id="dec"><span>–</span><span>–</span></div>
        <div class="meta" id="acc">&nbsp;</div>
      </div>
    </div>
    <div class="fmt" id="fmt" role="group" aria-label="Formato de coordenadas">
        <button type="button" data-f="dec">Decimal</button>
        <button type="button" data-f="dms">GMS</button>
        <button type="button" data-f="dm">Náutico</button>
        <button type="button" data-f="utm">UTM</button>
        <button type="button" data-f="mgrs">MGRS</button>
    </div>
    <div class="fmt-hint" id="fmtHint"></div>
  </section>


  <section class="card">
    <div class="label">Dirección aproximada</div>
    <div class="address" id="addr">–</div>
    <div class="meta" id="addrMeta">Necesita internet. Las coordenadas funcionan sin cobertura de datos.</div>
  </section>

  <div class="actions">
    <a class="btn call" href="tel:112" id="call">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
      Llamar al 112
    </a>
    <button class="btn" id="share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      Compartir
    </button>
    <button class="btn" id="copy" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      Copiar
    </button>
    <a class="btn" id="maps" href="#" target="_blank" rel="noopener" style="grid-column: 1 / -1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Ver en el mapa
    </a>
  </div>
  </div>

  <div class="pane" id="pCmp" role="tabpanel" aria-labelledby="tCmp" hidden>
    <section class="card cmp">
      <div class="cmp-read" aria-live="polite">
        <div class="cmp-deg" id="cDeg">···°</div>
        <div class="cmp-dir" id="cDir">&nbsp;</div>
      </div>
      <div class="dialbox">
        <div class="lubber" aria-hidden="true"></div>
        <svg viewBox="-160 -160 320 320" aria-hidden="true"><g id="dial"></g><circle class="d-center" r="5"/></svg>
      </div>
      <button class="cmp-btn" id="cOn" type="button">Activar brújula</button>
      <div class="cmp-note" id="cNote">Pon el móvil en horizontal, lejos de imanes y metales.</div>
      <div class="cmp-meta" id="cMeta"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div class="radio">En el mar, por radio: <b>VHF canal 16</b>.</div>

</div>

<script>
const $ = id => document.getElementById(id);
let pos = null;           // última posición
let lastGeo = null;       // última posición con dirección buscada
let address = "";

// ---------- Formatos ----------
const dec = v => v.toFixed(5);
// Grados, minutos y segundos: 36°35'35,2" N
function dms(v, P, N) {
  const h = v >= 0 ? P : N, a = Math.abs(v);
  let d = Math.floor(a), m = Math.floor((a - d) * 60), s = ((a - d) * 60 - m) * 60;
  if (s >= 59.95) { s = 0; m++; } if (m === 60) { m = 0; d++; }
  return `${d}°${String(m).padStart(2, "0")}'${s.toFixed(1).padStart(4, "0").replace(".", ",")}" ${h}`;
}
// Grados y minutos decimales (náutico): 36° 35,587' N
function dm(v, P, N) {
  const h = v >= 0 ? P : N, a = Math.abs(v);
  const d = Math.floor(a), m = (a - d) * 60;
  return `${d}° ${m.toFixed(3).padStart(6, "0").replace(".", ",")}' ${h}`;
}
// ---------- UTM y MGRS (elipsoide WGS84, equivalente a ETRS89 a efectos prácticos) ----------
function toUTM(lat, lon) {
  let zone = Math.floor((lon + 180) / 6) + 1;
  if (lat >= 56 && lat < 64 && lon >= 3 && lon < 12) zone = 32;               // excepción de Noruega
  if (lat >= 72 && lat < 84) {                                                // excepciones de Svalbard
    if (lon >= 0 && lon < 9) zone = 31; else if (lon >= 9 && lon < 21) zone = 33;
    else if (lon >= 21 && lon < 33) zone = 35; else if (lon >= 33 && lon < 42) zone = 37;
  }
  const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
  const e2 = f * (2 - f), ep2 = e2 / (1 - e2);
  const φ = lat * Math.PI / 180, λ = lon * Math.PI / 180, λ0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
  const N = a / Math.sqrt(1 - e2 * Math.sin(φ) ** 2), T = Math.tan(φ) ** 2, C = ep2 * Math.cos(φ) ** 2, A = Math.cos(φ) * (λ - λ0);
  const M = a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * φ - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * φ)
    + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * φ) - (35 * e2 ** 3 / 3072) * Math.sin(6 * φ));
  const E = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T ** 2 + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  let Nn = k0 * (M + N * Math.tan(φ) * (A ** 2 / 2 + (5 - T + 9 * C + 4 * C ** 2) * A ** 4 / 24 + (61 - 58 * T + T ** 2 + 600 * C - 330 * ep2) * A ** 6 / 720));
  if (lat < 0) Nn += 10000000;
  const band = "CDEFGHJKLMNPQRSTUVWXX"[Math.max(0, Math.min(20, Math.floor((lat + 80) / 8)))];
  return { zone, band, E, N: Nn };
}
function toMGRS(lat, lon) {
  const u = toUTM(lat, lon);
  const set = (u.zone - 1) % 3;                                       // columna: grupos de 8 letras según la zona
  const colLetters = ["ABCDEFGH", "JKLMNPQR", "STUVWXYZ"][set];
  const col = colLetters[Math.floor(u.E / 100000) - 1];
  const rowLetters = "ABCDEFGHJKLMNPQRSTUV";                           // fila: 20 letras, desplazada en zonas pares
  const row = rowLetters[(Math.floor(u.N / 100000) + (u.zone % 2 === 0 ? 5 : 0)) % 20];
  const e = String(Math.floor(u.E % 100000)).padStart(5, "0"), n = String(Math.floor(u.N % 100000)).padStart(5, "0");
  return { gzd: `${u.zone}${u.band}`, sq: col + row, e, n };
}
const grp = n => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");   // 4 474 257
const FORMATS = {
  dec:  { pair: (la, lo) => [dec(la), dec(lo)], hint: "Grados decimales · Formato de Google Maps" },
  dms:  { pair: (la, lo) => [dms(la, "N", "S"), dms(lo, "E", "O")], hint: "Grados, minutos y segundos · Formato clásico" },
  dm:   { pair: (la, lo) => [dm(la, "N", "S"), dm(lo, "E", "O")], hint: "Grados y minutos · El que se usa en el mar" },
  utm:  { pair: (la, lo) => { const u = toUTM(la, lo); return [`${u.zone}${u.band} ${grp(Math.round(u.E))} E`, `${grp(Math.round(u.N))} N`]; },
          hint: "UTM · El de los mapas topográficos y rescate en montaña" },
  mgrs: { pair: (la, lo) => { const m = toMGRS(la, lo); return [`${m.gzd} ${m.sq}`, `${m.e} ${m.n}`]; },
          hint: "MGRS · Sistema militar de la OTAN, precisión de 1 metro" },
};
let fmt = "dec";
try { const f = localStorage.getItem("de_fmt"); if (FORMATS[f]) fmt = f; } catch {}
function paintFmt() {
  document.querySelectorAll("#fmt button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === fmt));
  $("fmtHint").textContent = FORMATS[fmt].hint;
}
const distM = (a, b) => {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLon = toR(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

// ---------- Pintar ----------
function render() {
  if (!pos) return;
  const { lat, lon, acc, alt, t } = pos;
  const [l1, l2] = FORMATS[fmt].pair(lat, lon);
  $("dec").innerHTML = `<span>${l1}</span><span>${l2}</span>`;
  $("acc").textContent = `Precisión ±${Math.round(acc)} m${alt != null ? ` · Altitud ${Math.round(alt)} m` : ""}`;
  $("maps").href = `https://www.google.com/maps/search/?api=1&query=${dec(lat)},${dec(lon)}`;
  const f = $("fix");
  f.className = "fix " + (acc <= 30 ? "live" : "weak");
  $("fixTxt").textContent = acc <= 30 ? "GPS activo" : "Precisión baja";
}

function messageText() {
  if (!pos) return "";
  const { lat, lon, acc } = pos;
  return [
    "Mi ubicación:",
    `${FORMATS[fmt].pair(lat, lon).join(fmt === "dec" ? ", " : " ")}${fmt === "utm" || fmt === "mgrs" ? " (" + fmt.toUpperCase() + ")" : ""} (±${Math.round(acc)} m)`,
    fmt !== "dec" ? `${dec(lat)}, ${dec(lon)}` : "",
    address ? `Dirección aprox.: ${address}` : "",
    `https://www.google.com/maps/search/?api=1&query=${dec(lat)},${dec(lon)}`,
  ].filter(Boolean).join("\n");
}

// ---------- Dirección ----------
// 1º CartoCiudad (Instituto Geográfico Nacional): portales oficiales de España.
// 2º OpenStreetMap si CartoCiudad no responde o no encuentra nada.
// Se busca de nuevo cada vez que te mueves más de 15 m.
const cap = t => String(t || "").toLowerCase().replace(/(^|[\s(\-\/])(\p{L})/gu, (m, a, c) => a + c.toUpperCase());
// Partículas en minúscula salvo al principio: "Puerto de Santa Maria (El)"
const capES = t => cap(t).replace(/(?<=\s)(De|Del|La|Las|Los|Y)(?=\s)/g, w => w.toLowerCase());
// Quita tildes y mayúsculas para comparar nombres de calle
const norm = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
// Tipos de vía habituales, para saber si el nombre ya lo lleva delante
const VIA = /^(calle|avenida|avda|plaza|paseo|carretera|camino|glorieta|ronda|travesia|callejon|pasaje|urbanizacion|barriada|carril|cuesta|muelle|poligono|via|rambla|costanilla|bulevar)\b/i;

async function fromCartoCiudad(lat, lon) {
  const r = await fetch(`https://www.cartociudad.es/geocoder/api/geocoder/reverseGeocode?lon=${lon}&lat=${lat}`);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  if (!j || !j.address) return null;
  // tip_via puede venir como texto ("CALLE") o como código numérico; solo se usa si es texto
  const tipo = j.tip_via && isNaN(j.tip_via) ? String(j.tip_via) : "";
  let name = capES(j.address);
  if (tipo && !VIA.test(norm(name))) name = capES(tipo) + " " + name;
  return {
    name, number: j.portalNumber && j.portalNumber !== "0" ? String(j.portalNumber) : "",
    town: [j.postalCode, capES(j.poblacion || j.muni)].filter(Boolean).join(" "),
    region: capES(j.province), postal: j.postalCode || "",
  };
}
async function fromOSM(lat, lon) {
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=es&zoom=18`);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  const a = j.address || {};
  const name = a.road || a.pedestrian || a.footway || a.path || "";
  if (!name && !j.display_name) return null;
  return {
    name, number: a.house_number || "",
    town: [a.postcode, a.city || a.town || a.village || a.municipality].filter(Boolean).join(" "),
    region: a.province || a.state || "", full: j.display_name || "",
    townName: a.city || a.town || a.village || a.municipality || "", province: a.province || "",
  };
}
async function lookupAddress() {
  if (!pos) return;
  const here = { lat: pos.lat, lon: pos.lon };
  if (lastGeo && distM(lastGeo, here) < 15) return;
  lastGeo = here;
  // Las dos fuentes a la vez: CartoCiudad da el número oficial,
  // OpenStreetMap suele dar el nombre con tildes y con el tipo de vía ("Calle Espíritu Santo")
  const [c, o] = await Promise.allSettled([fromCartoCiudad(here.lat, here.lon), fromOSM(here.lat, here.lon)]);
  const cc = c.status === "fulfilled" ? c.value : null;
  const os = o.status === "fulfilled" ? o.value : null;
  let name = "", number = "", town = "", region = "", src = "";
  if (cc) {
    ({ name, number, town, region } = cc); src = "CartoCiudad (IGN)";
    // Si OpenStreetMap tiene la misma calle, se usa su nombre (con tildes y tipo de vía)
    if (os && os.name) {
      const bare = n => norm(n).replace(VIA, "").trim();
      if (bare(os.name) && bare(os.name) === bare(cc.name)) {
        name = VIA.test(norm(os.name)) ? os.name : (cc.name.match(VIA)?.[0] ? cc.name.split(" ")[0] + " " + os.name : os.name);
      }
    }
    // Municipio y provincia también con tildes si OpenStreetMap los tiene ("El Puerto de Santa María · Cádiz")
    if (os && os.townName) town = [cc.postal, os.townName].filter(Boolean).join(" ");
    if (os && os.province) region = os.province;
  } else if (os) {
    ({ name, number, town, region } = os); src = "OpenStreetMap";
  }
  const street = [name, number].filter(Boolean).join(", ");
  const text = [street, town, region].filter(Boolean).join(" · ") || os?.full || "";
  if (text) {
    address = text;
    $("addr").textContent = address;
    $("addrMeta").textContent = "Las coordenadas son el dato exacto.";
  } else {
    lastGeo = null;
    $("addr").textContent = "No se pudo obtener la dirección (sin conexión o punto sin calle cercana)";
  }
}

// ---------- GPS ----------
function showNotice(html, retry) {
  $("notice").innerHTML = html + (retry ? `<br><button type="button" id="retry">Volver a intentarlo</button>` : "");
  $("notice").hidden = false;
  if (retry) $("retry").onclick = () => { $("notice").hidden = true; start(); };
}
let watchId = null;
function start() {
  if (!("geolocation" in navigator)) { showNotice("<b>Este navegador no permite usar la ubicación.</b>Ábrela en Safari."); return; }
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  $("fixTxt").textContent = "Buscando GPS…";
  watchId = navigator.geolocation.watchPosition(p => {
    $("notice").hidden = true;
    pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude, t: p.timestamp };
    render(); lookupAddress();
  }, err => {
    $("fix").className = "fix"; $("fixTxt").textContent = "Sin ubicación";
    if (err.code === 1) showNotice("<b>No hay permiso para la ubicación.</b>En el iPhone: Ajustes → Privacidad y seguridad → Localización → Sitios web de Safari → «Mientras se usa la app» y «Ubicación exacta» activada.", true);
    else if (err.code === 3) showNotice("<b>El GPS está tardando.</b>Sal a un sitio abierto o acércate a una ventana.", true);
    else showNotice("<b>No se pudo obtener la ubicación.</b>Comprueba que la localización está activada.", true);
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

// ---------- Acciones ----------
function toast(t) { $("toast").textContent = t; setTimeout(() => { $("toast").textContent = ""; }, 2500); }
$("copy").onclick = async () => {
  if (!pos) return toast("Aún no hay ubicación");
  try { await navigator.clipboard.writeText(messageText()); toast("Ubicación copiada"); }
  catch { toast("No se pudo copiar; mantén pulsadas las coordenadas para copiarlas"); }
};
$("share").onclick = async () => {
  if (!pos) return toast("Aún no hay ubicación");
  if (navigator.share) { try { await navigator.share({ title: "Mi ubicación", text: messageText() }); } catch {} }
  else $("copy").click();
};
$("maps").addEventListener("click", e => { if (!pos) { e.preventDefault(); toast("Aún no hay ubicación"); } });

// Reloj segundo a segundo con la hora real
function tick() {
  const now = new Date();
  $("fixDate").textContent = now.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
  $("fixTime").textContent = now.toLocaleTimeString("es-ES");
  // Si el GPS lleva más de 30 s sin dar una lectura nueva, se avisa
  if (pos) {
    const age = Math.round((now - pos.t) / 1000);
    if (age > 30) { $("fix").className = "fix weak"; $("fixTxt").textContent = `Última lectura hace ${age < 120 ? age + " s" : Math.round(age / 60) + " min"}`; }
  }
}
tick();
setInterval(tick, 1000);

$("fmt").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  fmt = b.dataset.f;
  try { localStorage.setItem("de_fmt", fmt); } catch {}
  paintFmt(); render();
});
paintFmt();
start();
// Al volver a la app, se reactiva el GPS
document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });


// ---------- Pestañas ----------
function showTab(t) {
  const cmp = t === "cmp";
  $("tLoc").setAttribute("aria-selected", !cmp); $("tCmp").setAttribute("aria-selected", cmp);
  $("pLoc").hidden = cmp; $("pCmp").hidden = !cmp;
  try { localStorage.setItem("de_tab", t); } catch {}
  if (cmp) autoCompass();
}
$("tLoc").onclick = () => showTab("loc");
$("tCmp").onclick = () => showTab("cmp");

// ---------- Brújula ----------
// Esfera dibujada una vez; luego solo se gira
(function drawDial() {
  const g = [], R = 150;
  g.push(`<circle class="d-ring" r="${R}"/>`);
  for (let a = 0; a < 360; a += 5) {
    const big = a % 30 === 0, r1 = R - (big ? 18 : a % 10 === 0 ? 11 : 6), t = (a - 90) * Math.PI / 180;
    g.push(`<line class="d-tick${big ? " big" : ""}" x1="${(R - 2) * Math.cos(t)}" y1="${(R - 2) * Math.sin(t)}" x2="${r1 * Math.cos(t)}" y2="${r1 * Math.sin(t)}"/>`);
    if (big && a % 90 !== 0) { const rr = R - 32; g.push(`<text class="d-num" x="${rr * Math.cos(t)}" y="${rr * Math.sin(t)}" transform="rotate(${a} ${rr * Math.cos(t)} ${rr * Math.sin(t)})">${a}</text>`); }
  }
  const card = [["N", 0, "n"], ["E", 90, ""], ["S", 180, ""], ["O", 270, ""]];
  for (const [l, a, c] of card) { const t = (a - 90) * Math.PI / 180, rr = R - 42; g.push(`<text class="d-card ${c}" x="${rr * Math.cos(t)}" y="${rr * Math.sin(t)}" transform="rotate(${a} ${rr * Math.cos(t)} ${rr * Math.sin(t)})">${l}</text>`); }
  for (const [l, a] of [["NE", 45], ["SE", 135], ["SO", 225], ["NO", 315]]) { const t = (a - 90) * Math.PI / 180, rr = R - 46; g.push(`<text class="d-inter" x="${rr * Math.cos(t)}" y="${rr * Math.sin(t)}" transform="rotate(${a} ${rr * Math.cos(t)} ${rr * Math.sin(t)})">${l}</text>`); }
  g.push(`<path d="M0 -${R - 60} L9 0 L-9 0 Z" fill="var(--sos)"/><path d="M0 ${R - 60} L9 0 L-9 0 Z" fill="var(--muted)"/>`);
  $("dial").innerHTML = g.join("");
})();
const PUNTOS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSO", "SO", "OSO", "O", "ONO", "NO", "NNO"];
const NOMBRES = { N: "Norte", E: "Este", S: "Sur", O: "Oeste", NE: "Noreste", SE: "Sureste", SO: "Suroeste", NO: "Noroeste" };
let shown = null, target = null, cmpOn = false, gotReading = false;
function onHeading(h) {
  if (h == null || isNaN(h)) return;
  gotReading = true;
  target = (h + 360) % 360;
  if (shown == null) shown = target;
}
// Suavizado: gira por el camino corto (de 359° a 1° no da la vuelta entera)
function animate() {
  if (target != null) {
    let d = ((target - shown + 540) % 360) - 180;
    shown += d * 0.18;
    $("dial").setAttribute("transform", `rotate(${(-shown).toFixed(2)})`);
    const deg = Math.round((target + 360) % 360) % 360;
    $("cDeg").textContent = `${deg}°`;
    const p = PUNTOS[Math.round(deg / 22.5) % 16];
    $("cDir").textContent = NOMBRES[p] ? `${p} · ${NOMBRES[p]}` : p;
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
function screenAngle() { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function startCompass() {
  if (cmpOn) return; cmpOn = true;
  $("cOn").hidden = true;
  $("cMeta").textContent = "Norte magnético";
  if ("ondeviceorientationabsolute" in window) {
    // Android (Chrome): orientación absoluta respecto al norte
    addEventListener("deviceorientationabsolute", e => { if (e.alpha != null) onHeading(360 - e.alpha + screenAngle()); });
  } else {
    addEventListener("deviceorientation", e => {
      if (e.webkitCompassHeading != null) onHeading(e.webkitCompassHeading + screenAngle());   // iPhone
      else if (e.absolute && e.alpha != null) onHeading(360 - e.alpha + screenAngle());
    });
  }
  setTimeout(() => { if (!gotReading) { $("cNote").textContent = "Este dispositivo no tiene brújula o no la deja usar al navegador. En un ordenador no funciona: úsala en el móvil."; $("cMeta").textContent = ""; } }, 3000);
}
async function enableCompass() {
  // En iPhone hay que pedir permiso tocando un botón
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try {
      const r = await DeviceOrientationEvent.requestPermission();
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (r !== "granted" && ios) { $("cNote").textContent = "Sin permiso para la brújula. Cierra la app del todo, ábrela otra vez y pulsa «Activar brújula» → Permitir."; return; }
    } catch {}
  }
  startCompass();
}
// En Android no hace falta permiso: arranca sola al abrir la pestaña
function autoCompass() {
  const needsPermission = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
  if (!needsPermission) startCompass();
}
$("cOn").onclick = enableCompass;
try { if (localStorage.getItem("de_tab") === "cmp") showTab("cmp"); } catch {}

// Modo sin conexión: guarda una copia de la app para abrirla sin cobertura
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
